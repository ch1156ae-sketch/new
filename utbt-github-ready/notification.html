<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>알림 | UTBT</title>

    <style>
        @charset "UTF-8";

        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");

        :root {
            --main: #ff5a20;
            --main-light: #ffbba4;
            --text: #111827;
            --muted: #6b7280;
            --background: #ecedee;
            --surface: #ffffff;
            --header-height: 64px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-width: 375px;
            min-height: 100vh;

            display: flex;
            justify-content: center;

            background: #e9eaed;
            color: var(--text);

            font-family: "Pretendard", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button {
            border: 0;
            padding: 0;

            background: transparent;

            color: inherit;
            font: inherit;
            font-family: inherit;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        /* =====================================================
           APP
        ===================================================== */

        .app-shell {
            position: relative;

            width: 375px;
            height: 812px;

            overflow: hidden;

            background: #ecedee;

            box-shadow:
                0 0 28px rgba(24, 30, 39, 0.08);
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .notification-header {
            position: absolute;
            z-index: 50;

            top: 0;
            left: 0;

            display: flex;
            align-items: center;

            width: 100%;
            height: var(--header-height);

            padding: 8px 24px;

            gap: 8px;

            background: #ffffff;
        }

        .back-button {
            display: grid;

            width: 24px;
            height: 48px;

            flex: 0 0 24px;

            place-items: center;

            color: #6b7280;

            transition: color 0.2s ease;
        }

        .back-button svg {
            display: block;

            width: 24px;
            height: 24px;

            fill: none;

            stroke: currentColor;
            stroke-width: 1.5;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .back-button:hover,
        .back-button:focus-visible {
            color: #ff5a20;
        }

        .header-title {
            color: #111827;

            font-size: 20px;
            line-height: 24px;

            font-weight: 600;

            letter-spacing: -0.4px;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .notification-main {
            position: absolute;

            top: var(--header-height);
            right: 0;
            bottom: 0;
            left: 0;

            overflow-y: auto;
            overflow-x: hidden;

            background: #ecedee;

            scrollbar-width: none;
        }

        .notification-main::-webkit-scrollbar {
            display: none;
        }

        .notification-content {
            width: 100%;

            padding: 24px 24px 40px;
        }

        /* =====================================================
           FIRST CARD
        ===================================================== */

        .notification-info {
            display: flex;
            align-items: center;

            width: 327px;
            height: 88px;

            padding: 8px 12px;

            border-radius: 16px;

            background: #ffffff;
        }

        /* =====================================================
           NEW VECTOR SVG
           52 × 52
        ===================================================== */

        .notification-illustration {
            display: flex;

            width: 52px;
            height: 52px;

            flex: 0 0 52px;

            align-items: center;
            justify-content: center;
        }

        .notification-illustration img {
            display: block;

            width: 52px;
            height: 52px;

            object-fit: contain;

            user-select: none;
            -webkit-user-drag: none;
        }

        /* =====================================================
           CARD TEXT
        ===================================================== */

        .notification-copy {
            min-width: 0;

            flex: 1;

            margin-left: 18px;
        }

        .notification-copy h2 {
            margin: 0 0 4px;

            color: #111827;

            font-family: "Pretendard", sans-serif;

            font-size: 18px;
            line-height: 22px;

            font-weight: 500;

            letter-spacing: -0.3px;
        }

        .notification-copy p {
            margin: 0;

            color: #111827;

            font-family: "Pretendard", sans-serif;

            font-size: 16px;
            line-height: 20px;

            font-weight: 400;

            letter-spacing: -0.25px;
        }

        /* =====================================================
           MORE ICON
        ===================================================== */

        .more-button {
            display: grid;

            width: 24px;
            height: 24px;

            flex: 0 0 24px;

            margin-left: 4px;

            place-items: center;

            color: #6b7280;

            transition: color 0.2s ease;
        }

        .more-button svg {
            display: block;

            width: 24px;
            height: 24px;
        }

        .more-button:hover,
        .more-button:focus-visible {
            color: #ff5a20;
        }

        /* =====================================================
           NOTIFICATION LIST
        ===================================================== */

        .notification-list {
            width: 327px;

            margin-top: 24px;

            padding: 3px 12px;

            border-radius: 16px;

            background: #ffffff;
        }

        .notification-row {
            display: flex;
            align-items: center;

            width: 100%;
            height: 43px;
        }

        .item-info {
            display: flex;
            align-items: center;

            min-width: 0;

            flex: 1;
        }

        .item-emoji {
            display: flex;

            width: 20px;

            flex: 0 0 20px;

            align-items: center;
            justify-content: flex-start;

            font-size: 15px;
            line-height: 1;
        }

        .item-name {
            margin-left: 1px;

            color: #111827;

            font-size: 15px;
            line-height: 20px;

            font-weight: 500;

            letter-spacing: -0.25px;
        }

        .notification-setting {
            display: flex;
            align-items: center;

            flex-shrink: 0;
        }

        .toggle-label {
            margin-right: 5px;

            color: #6b7280;

            font-size: 14px;
            line-height: 20px;

            font-weight: 400;

            letter-spacing: -0.25px;

            white-space: nowrap;

            transition: color 0.2s ease;
        }

        .notification-row.is-active .toggle-label {
            color: #111827;
        }

        /* =====================================================
           TOGGLE
        ===================================================== */

        .toggle {
            position: relative;

            width: 48px;
            height: 24px;

            flex: 0 0 48px;

            border-radius: 999px;

            background: #ffbba4;

            transition: background-color 0.2s ease;
        }

        .toggle-knob {
            position: absolute;

            top: 2px;
            left: 2px;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            background: #ffffff;

            box-shadow:
                0 1px 2px rgba(17, 24, 39, 0.06);

            transition: transform 0.2s ease;
        }

        .notification-row.is-active .toggle {
            background: #ff5a20;
        }

        .notification-row.is-active .toggle-knob {
            transform: translateX(24px);
        }

        /* =====================================================
           FOCUS
        ===================================================== */

        .toggle:focus-visible,
        .back-button:focus-visible,
        .more-button:focus-visible {
            outline:
                3px solid rgba(255, 90, 32, 0.3);

            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }

        @media (max-width: 375px) {
            body {
                background: #ecedee;
            }

            .app-shell {
                width: 100%;
            }
        }
    </style>
</head>

                    <div class="notification-copy">

                        <h2>
                            관심 품목 알림
                        </h2>

                        <p>
                            내가 찜한 식재료,<br>
                            구조 요청 시 알려드려요!
                        </p>

                    </div>


                    <!-- MORE -->

                    <button
                        type="button"
                        class="more-button"
                        aria-label="더보기"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <circle
                                cx="12"
                                cy="5"
                                r="1"
                                fill="currentColor"
                            ></circle>

                            <circle
                                cx="12"
                                cy="12"
                                r="1"
                                fill="currentColor"
                            ></circle>

                            <circle
                                cx="12"
                                cy="19"
                                r="1"
                                fill="currentColor"
                            ></circle>
                        </svg>
                    </button>

                </section>


                <!-- =================================================
                     NOTIFICATION LIST
                ================================================== -->

                <section
                    class="notification-list"
                    aria-label="관심 품목 알림 설정"
                >

                    <!-- 딸기 -->

                    <div class="notification-row is-active">

                        <div class="item-info">

                            <span
                                class="item-emoji"
                                aria-hidden="true"
                            >
                                🍓
                            </span>

                            <span class="item-name">
                                딸기
                            </span>

                        </div>

                        <div class="notification-setting">

                            <span class="toggle-label">
                                알림끄기
                            </span>

                            <button
                                type="button"
                                class="toggle"
                                role="switch"
                                aria-checked="true"
                                aria-label="딸기 알림"
                            >
                                <span class="toggle-knob"></span>
                            </button>

                        </div>

                    </div>


                    <!-- 토마토 -->

                    <div class="notification-row">

                        <div class="item-info">

                            <span
                                class="item-emoji"
                                aria-hidden="true"
                            >
                                🍅
                            </span>

                            <span class="item-name">
                                토마토
                            </span>

                        </div>

                        <div class="notification-setting">

                            <span class="toggle-label">
                                알림설정
                            </span>

                            <button
                                type="button"
                                class="toggle"
                                role="switch"
                                aria-checked="false"
                                aria-label="토마토 알림"
                            >
                                <span class="toggle-knob"></span>
                            </button>

                        </div>

                    </div>


                    <!-- 치즈 -->

                    <div class="notification-row">

                        <div class="item-info">

                            <span
                                class="item-emoji"
                                aria-hidden="true"
                            >
                                🧀
                            </span>

                            <span class="item-name">
                                치즈
                            </span>

                        </div>

                        <div class="notification-setting">

                            <span class="toggle-label">
                                알림설정
                            </span>

                            <button
                                type="button"
                                class="toggle"
                                role="switch"
                                aria-checked="false"
                                aria-label="치즈 알림"
                            >
                                <span class="toggle-knob"></span>
                            </button>

                        </div>

                    </div>


                    <!-- 양파 -->

                    <div class="notification-row">

                        <div class="item-info">

                            <span
                                class="item-emoji"
                                aria-hidden="true"
                            >
                                🧅
                            </span>

                            <span class="item-name">
                                양파
                            </span>

                        </div>

                        <div class="notification-setting">

                            <span class="toggle-label">
                                알림설정
                            </span>

                            <button
                                type="button"
                                class="toggle"
                                role="switch"
                                aria-checked="false"
                                aria-label="양파 알림"
                            >
                                <span class="toggle-knob"></span>
                            </button>

                        </div>

                    </div>

                </section>

            </div>

        </main>

    </div>


    <script>
        document.addEventListener("DOMContentLoaded", () => {

            /* =================================================
               NOTIFICATION TOGGLE
            ================================================= */

            const notificationRows =
                document.querySelectorAll(
                    ".notification-row"
                );

            notificationRows.forEach(row => {

                const toggle =
                    row.querySelector(".toggle");

                const label =
                    row.querySelector(
                        ".toggle-label"
                    );

                toggle.addEventListener(
                    "click",
                    () => {

                        const isActive =
                            row.classList.toggle(
                                "is-active"
                            );

                        toggle.setAttribute(
                            "aria-checked",
                            String(isActive)
                        );

                        label.textContent =
                            isActive
                                ? "알림끄기"
                                : "알림설정";

                    }
                );

            });


            /* =================================================
               BACK
            ================================================= */

            const backButton =
                document.getElementById(
                    "backButton"
                );

            backButton.addEventListener(
                "click",
                () => {

                    if (
                        window.history.length > 1
                    ) {

                        window.history.back();

                    } else {

                        window.location.href =
                            "index.html";

                    }

                }
            );

        });
    </script>

</body>
</html>
