<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ffffff"><title>카테고리 | UTBT</title>
<style>
@charset "UTF-8";
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
:root { --main: #ff5a20; --text: #292c33; --surface: #f5f6f9; --nav-height: 84px; --header-height: 64px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-width: 375px; min-height: 100vh; display: flex; justify-content: center; background: #e9eaed; color: var(--text); font-family: "Pretendard", sans-serif; -webkit-font-smoothing: antialiased; }
button, a { color: inherit; font: inherit; font-family: inherit; }
button { border: 0; cursor: pointer; }
a { text-decoration: none; }
.app-shell { position: relative; width: 375px; height: 812px; flex: 0 0 375px; overflow: hidden; background: var(--surface); box-shadow: 0 0 28px rgba(24,30,39,.08); }
.app-header { position: absolute; z-index: 50; top: 0; left: 0; display: flex; align-items: center; justify-content: space-between; width: 100%; height: var(--header-height); padding: 20px 24px; background: #fbfbfb; box-shadow: inset 0 -1px 0 #ecedee; }
.app-header h1 { font-size: 22px; font-weight: 500; letter-spacing: -.5px; color: #111827; }
.header-actions { display: flex; align-items: center; gap: 8px; height: 24px; }
.icon-button { display: grid; width: 24px; height: 24px; flex: 0 0 24px; place-items: center; background: transparent; }
.header-icon { display: block; width: 24px; height: 24px; color: #6b7280; transition: color .2s; }
.alarm-icon path { fill: transparent; stroke: currentColor; stroke-width: 1.5; transition: fill .2s, stroke .2s; }
.bag-icon .bag-outline { fill: currentColor; transition: opacity .2s; }
.bag-icon .bag-fill { fill: currentColor; opacity: 0; transition: opacity .2s; }
.icon-button:hover .header-icon { color: #ff5a20; }
.icon-button:hover .alarm-icon path { fill: currentColor; }
.icon-button:hover .bag-fill { opacity: 1; }
.quick-links { position: absolute; top: var(--header-height); left: 0; display: flex; align-items: center; justify-content: flex-start; gap: 24px; width: 100%; height: 70px; padding: 0 24px; overflow-x: auto; overflow-y: hidden; background: #ffffff; box-shadow: inset 0 -1px 0 #caccd1; scrollbar-width: none; -webkit-overflow-scrolling: touch; touch-action: pan-x; user-select: none; cursor: grab; }
.quick-links.is-dragging { cursor: grabbing; }
.quick-links::-webkit-scrollbar { display: none; }
.quick-link { display: flex; flex: 0 0 44px; width: 44px; height: 45px; align-items: center; justify-content: center; flex-direction: column; gap: 4px; background: transparent; color: #6b7280; font-size: 10px; font-weight: 500; white-space: nowrap; }
.quick-badge { display: grid; width: 28px; height: 28px; flex: 0 0 28px; place-items: center; }
.quick-badge img { display: block; width: 28px; height: 28px; object-fit: contain; }
.quick-link:hover, .quick-link:focus-visible { color: var(--main); }
.category-main { position: absolute; top: calc(var(--header-height) + 70px); right: 0; bottom: var(--nav-height); left: 0; display: flex; overflow: hidden; background: var(--surface); }
.category-side { width: 128px; flex: 0 0 128px; overflow-y: auto; border-right: 1px solid #e3e5e9; padding: 24px 15px 20px 24px; scrollbar-width: none; }
.category-side::-webkit-scrollbar, .category-content::-webkit-scrollbar { display: none; }
.category-side button { display: flex; align-items: center; gap: 10px; width: 88px; height: 40px; margin-bottom: 4px; padding: 12px 8px; border-radius: 8px; background: transparent; text-align: left; color: #6b7280; font-size: 16px; font-weight: 500; line-height: 16px; white-space: nowrap; }
.category-side button.is-active { color: var(--main); background: #fff; }
.category-side button:hover { color: var(--main); background: #fff; }
.category-content { position: relative; flex: 1; min-width: 0; overflow: hidden; touch-action: none; user-select: none; }
.category-groups { display: flex; flex-direction: column; height: 100%; transition: transform .4s cubic-bezier(.22,.75,.25,1); will-change: transform; }
.category-group { flex: 0 0 100%; min-height: 100%; padding: 24px 24px 26px; overflow: hidden; }
.category-group.is-current.is-animating .card-grid { animation: category-arrive .28s ease both; }
@keyframes category-arrive { from { opacity: .72; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.card-grid { display: grid; grid-template-columns: repeat(3, 61px); align-content: start; column-gap: 8px; row-gap: 24px; }
.category-card { display: flex; width: 61px; min-width: 0; flex-direction: column; align-items: center; gap: 4px; border-radius: 9px; background: none; color: #111827; font-size: 10px; font-weight: 400; line-height: 1.25; white-space: nowrap; text-align: center; }
.category-card .card-image { display: grid; width: 61px; height: 88px; flex: none; place-items: center; overflow: hidden; border-radius: 9px; background: white; font-size: 25px; }
.category-card .card-image img { display: block; max-width: 24px; max-height: 30px; width: auto; height: auto; object-fit: contain; }
.category-card .card-image img.custom-icon { width: 24px; height: 24px; max-width: 24px; max-height: 24px; }
.category-card.promo .card-image { background: #fff4ef; color: #ff5a20; font-size: 11px; font-weight: 500; line-height: 1.25; }
.category-card:hover .card-image, .category-card:focus-visible .card-image { outline: 2px solid #ff9f7e; }
.category-card:hover .card-label, .category-card:focus-visible .card-label { color: #ff5a20; }
.category-card .card-label { display: block; max-width: 78px; white-space: normal; word-break: keep-all; }
.bottom-nav { position: absolute; z-index: 60; bottom: 0; left: 0; display: flex; width: 375px; height: var(--nav-height); padding: 0 24px; align-items: stretch; justify-content: center; gap: 50px; border-top: 1px solid #eceef1; background: rgba(255,255,255,.97); box-shadow: 0 -5px 16px rgba(35,42,51,.035); backdrop-filter: blur(12px); }
.nav-item { display: flex; width: 24px; flex: 0 0 24px; flex-direction: column; align-items: center; justify-content: center; gap: 0; color: #6b7280; background: transparent; font-family: "Pretendard", sans-serif; font-size: 10px; font-weight: 500; white-space: nowrap; transition: color .2s ease; }
.nav-item svg { width: 24px; height: 24px; fill: none; stroke: currentColor; transition: fill .2s ease, stroke .2s ease; }
.nav-item svg .nav-icon-solid { fill: currentColor; stroke: none; }
.nav-item.is-active { color: var(--main); }
.nav-item.is-active svg { fill: currentColor; stroke: currentColor; }
.nav-item:hover, .nav-item:focus-visible { color: var(--main); }
.nav-item:hover svg, .nav-item:focus-visible svg { fill: currentColor; stroke: currentColor; }
.toast { position: absolute; z-index: 100; bottom: 84px; left: 50%; max-width: calc(100% - 40px); padding: 11px 16px; transform: translate(-50%, 16px); border-radius: 22px; color: #fff; background: rgba(37,40,46,.92); font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; }
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
button:focus-visible, a:focus-visible { outline: 3px solid rgba(255,90,32,.3); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; scroll-behavior: auto !important; } }
</style><script defer>
document.addEventListener("DOMContentLoaded", () => {
  // Each side category keeps the same card layout as the reference screen.
  const groups = {
    "농산물": [["BEST", "베스트", "promo"], ["SEASON", "제철", "promo"], ["ECO<br>FRIENDLY", "친환경", "promo"], ["apple", "뿌리채소"], ["carrot", "뿌리채소"], ["lettuce", "잎채소"], ["pepper", "뿌리채소"], ["mushroom", "버섯"], ["garlic", "향채 / 양념채소"]],
    "고기": [["BEST", "베스트", "promo"], ["SEASON", "제철", "promo"], ["ECO<br>FRIENDLY", "친환경", "promo"], ["beef", "소고기"], ["pork", "돼지고기"], ["chicken", "닭고기"]],
    "수산물": [["BEST", "베스트", "promo"], ["SEASON", "제철", "promo"], ["ECO<br>FRIENDLY", "친환경", "promo"], ["fish", "생선"], ["shrimp", "갑각류"], ["squid", "해산물"]],
    "유제품": [["BEST", "베스트", "promo"], ["SEASON", "제철", "promo"], ["ECO<br>FRIENDLY", "친환경", "promo"], ["milk", "우유"], ["cheese", "치즈"], ["yogurt", "요거트"]],
    "밀키트": [["BEST", "베스트", "promo"], ["SEASON", "제철", "promo"], ["ECO<br>FRIENDLY", "친환경", "promo"], ["soup", "국 / 찌개"], ["pasta", "면 요리"], ["curry", "한 끼 식사"]],
    "가공식품": [["BEST", "베스트", "promo"], ["SEASON", "제철", "promo"], ["ECO<br>FRIENDLY", "친환경", "promo"], ["canned", "통조림"], ["processed_meat", "가공육"], ["sauce", "소스 / 양념"]],
    "주류": [["BEST", "베스트", "promo"], ["SEASON", "제철", "promo"], ["ECO<br>FRIENDLY", "친환경", "promo"], ["wine", "와인"], ["soju", "전통주"], ["beer", "맥주"]],
    "펫푸드": [["BEST", "베스트", "promo"], ["SEASON", "제철", "promo"], ["ECO<br>FRIENDLY", "친환경", "promo"], ["dogfood", "강아지"], ["catfood", "고양이"], ["treat", "간식"]]
  };
  const iconSources = {"apple":"assets/icons/apple.png","carrot":"assets/icons/carrot.png","lettuce":"assets/icons/lettuce.png","pepper":"assets/icons/pepper.png","mushroom":"assets/icons/mushroom.png","garlic":"assets/icons/garlic.png","beef":"assets/icons/beef.png","pork":"assets/icons/pork.png","chicken":"assets/icons/chicken.png","fish":"assets/icons/fish.png","shrimp":"assets/icons/shrimp.png","squid":"assets/icons/squid.png","soup":"assets/icons/soup.png","pasta":"assets/icons/pasta.png","curry":"assets/icons/curry.png","wine":"assets/icons/wine.png","soju":"assets/icons/soju.png","beer":"assets/icons/beer.png","dogfood":"assets/icons/dogfood.png","catfood":"assets/icons/catfood.png","treat":"assets/icons/treat.png","fruit_clay":"assets/icons/fruit_clay.png","vegetable_clay":"assets/icons/vegetable_clay.png","fungus_clay":"assets/icons/fungus_clay.png","milk":"assets/icons/milk.png","cheese":"assets/icons/cheese.png","yogurt":"assets/icons/yogurt.png","canned":"assets/icons/canned.png","processed_meat":"assets/icons/processed_meat.png","sauce":"assets/icons/sauce.png"};
  const groupContainer = document.querySelector(".category-groups");
  const side = document.querySelector(".category-side");
  const content = document.querySelector(".category-content");
  const menuButtons = [...side.querySelectorAll("button")];
  const toast = document.querySelector(".toast");
  let timer;
  let activeGroup = "농산물";
  function announce(message) {
    clearTimeout(timer);
    toast.textContent = message;
    toast.classList.add("is-visible");
    timer = setTimeout(() => toast.classList.remove("is-visible"), 1800);
  }
  // Keep every category in one continuous column so swiping down reveals the next.
  Object.entries(groups).forEach(([name, cards]) => {
    const section = document.createElement("section");
    section.className = "category-group";
    section.dataset.group = name;
    section.setAttribute("aria-label", `${name} 세부 카테고리`);
    const grid = document.createElement("div");
    grid.className = "card-grid";
    cards.forEach(([symbol, label, kind]) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "category-card" + (kind === "promo" ? " promo" : "");
      const art = document.createElement("span");
      art.className = "card-image";
      if (kind === "promo") art.innerHTML = symbol;
      else {
        const icon = document.createElement("img");
        icon.src = iconSources[symbol];
        icon.className = ["apple", "carrot", "lettuce", "pepper", "mushroom", "garlic"].includes(symbol) ? "source-icon" : "custom-icon";
        icon.alt = "";
        icon.setAttribute("aria-hidden", "true");
        art.append(icon);
      }
      const caption = document.createElement("span");
      caption.className = "card-label";
      caption.textContent = label;
      card.append(art, caption);
      card.addEventListener("click", () => announce(`${name} · ${label}`));
      grid.append(card);
    });
    section.append(grid);
    groupContainer.append(section);
  });
  const sections = [...groupContainer.querySelectorAll(".category-group")];
  let currentIndex = 0;
  function setActive(name, playCardAnimation = false) {
    activeGroup = name;
    menuButtons.forEach(button => {
      const selected = button.textContent.trim() === name;
      button.classList.toggle("is-active", selected);
      if (selected) button.setAttribute("aria-current", "true");
      else button.removeAttribute("aria-current");
    });
    sections.forEach(section => {
      const isCurrent = section.dataset.group === name;
      section.classList.toggle("is-current", isCurrent);
      section.classList.remove("is-animating");
      if (isCurrent && playCardAnimation) {
        void section.offsetWidth;
        section.classList.add("is-animating");
      }
    });
    const button = menuButtons.find(item => item.textContent.trim() === name);
    if (button) {
      const pos = button.getBoundingClientRect();
      const bounds = side.getBoundingClientRect();
      if (pos.top < bounds.top || pos.bottom > bounds.bottom)
        side.scrollTo({ top: side.scrollTop + pos.top - bounds.top - 24, behavior: "smooth" });
    }
  }
  function goTo(index, animated = true) {
    const nextIndex = Math.max(0, Math.min(index, sections.length - 1));
    const didChange = nextIndex !== currentIndex;
    currentIndex = nextIndex;
    groupContainer.style.transition = animated && !window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "" : "none";
    groupContainer.style.transform = `translate3d(0, ${-currentIndex * content.clientHeight}px, 0)`;
    setActive(sections[currentIndex].dataset.group, animated && didChange);
    if (!animated) requestAnimationFrame(() => { groupContainer.style.transition = ""; });
  }
  menuButtons.forEach((button, index) => button.addEventListener("click", () => goTo(index)));

  // Each vertical swipe changes one full category panel.
  let pointerId = null;
  let startY = 0;
  let deltaY = 0;
  let screenMoved = false;
  let suppressCardClick = false;
  content.addEventListener("pointerdown", event => {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    pointerId = event.pointerId;
    startY = event.clientY;
    deltaY = 0;
    screenMoved = false;
  });
  content.addEventListener("pointermove", event => {
    if (event.pointerId !== pointerId) return;
    deltaY = event.clientY - startY;
    if (Math.abs(deltaY) < 5 && !screenMoved) return;
    if (!screenMoved) {
      screenMoved = true;
      content.setPointerCapture(event.pointerId);
      groupContainer.style.transition = "none";
    }
    event.preventDefault();
    const atEdge = (currentIndex === 0 && deltaY > 0) || (currentIndex === sections.length - 1 && deltaY < 0);
    const offset = atEdge ? deltaY * .3 : deltaY;
    groupContainer.style.transform = `translate3d(0, ${-currentIndex * content.clientHeight + offset}px, 0)`;
  });
  function finishSwipe(event) {
    if (event.pointerId !== pointerId) return;
    pointerId = null;
    if (content.hasPointerCapture(event.pointerId)) content.releasePointerCapture(event.pointerId);
    if (screenMoved) {
      suppressCardClick = true;
      setTimeout(() => { suppressCardClick = false; }, 0);
    }
    const next = screenMoved && Math.abs(deltaY) > 50 ? currentIndex + (deltaY < 0 ? 1 : -1) : currentIndex;
    void groupContainer.offsetHeight;
    goTo(next);
    screenMoved = false;
  }
  content.addEventListener("pointerup", finishSwipe);
  content.addEventListener("pointercancel", event => {
    deltaY = 0;
    finishSwipe(event);
  });
  content.addEventListener("click", event => {
    if (!suppressCardClick) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    suppressCardClick = false;
  }, true);
  let lastWheel = 0;
  content.addEventListener("wheel", event => {
    event.preventDefault();
    if (Math.abs(event.deltaY) < 2) return;
    const now = Date.now();
    const newGesture = now - lastWheel > 220;
    lastWheel = now;
    if (newGesture) goTo(currentIndex + (event.deltaY > 0 ? 1 : -1));
  }, { passive: false });
  content.addEventListener("keydown", event => {
    const direction = { ArrowDown: 1, PageDown: 1, ArrowUp: -1, PageUp: -1 }[event.key];
    if (direction) {
      event.preventDefault();
      goTo(currentIndex + direction);
    }
  });
  window.addEventListener("resize", () => goTo(currentIndex, false));
  // Touch devices use the browser's native horizontal swipe.
  // Mouse dragging and the wheel also work in desktop previews.
  const quickBar = document.querySelector(".quick-links");
  let dragging = false;
  let moved = false;
  let suppressClick = false;
  let startX = 0;
  let startScroll = 0;
  quickBar.addEventListener("pointerdown", (event) => {
    if (event.pointerType !== "mouse" || event.button !== 0) return;
    dragging = true;
    moved = false;
    startX = event.clientX;
    startScroll = quickBar.scrollLeft;
  });
  quickBar.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    const distance = event.clientX - startX;
    if (Math.abs(distance) > 4 && !moved) {
      moved = true;
      quickBar.setPointerCapture(event.pointerId);
      quickBar.classList.add("is-dragging");
    }
    if (moved) {
      event.preventDefault();
      quickBar.scrollLeft = startScroll - distance;
    }
  });
  function finishDrag(event) {
    if (!dragging) return;
    dragging = false;
    quickBar.classList.remove("is-dragging");
    if (quickBar.hasPointerCapture(event.pointerId)) quickBar.releasePointerCapture(event.pointerId);
    if (moved) {
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 0);
    }
  }
  quickBar.addEventListener("pointerup", finishDrag);
  quickBar.addEventListener("pointercancel", finishDrag);
  quickBar.addEventListener("click", (event) => {
    if (!suppressClick) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    suppressClick = false;
  }, true);
  quickBar.addEventListener("wheel", (event) => {
    if (quickBar.scrollWidth <= quickBar.clientWidth) return;
    const distance = event.deltaX || event.deltaY;
    if (!distance) return;
    event.preventDefault();
    quickBar.scrollLeft += distance;
  }, { passive: false });
  document.querySelectorAll(".quick-link").forEach(button => {
    button.addEventListener("click", () => {
      announce(`${button.dataset.page} 페이지로 이동합니다.`);
    });
  });
  goTo(0, false);
});
