<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>마이페이지 | UTBT</title>

    <style>
        @charset "UTF-8";
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");

        :root {
            --main: #ff5a20;
            --text: #292c33;
            --surface: #f5f6f9;
            --nav-height: 84px;
            --header-height: 64px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-width: 375px;
            min-height: 100vh;

            display: flex;
            justify-content: center;

            background: #e9eaed;
            color: var(--text);

            font-family: "Pretendard", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button,
        a {
            color: inherit;
            font: inherit;
            font-family: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        a {
            text-decoration: none;
        }

        .app-shell {
            position: relative;

            width: 375px;
            height: 812px;

            flex: 0 0 375px;

            overflow: hidden;

            background: #ffffff;

            box-shadow: 0 0 28px rgba(24, 30, 39, .08);
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .app-header {
            position: absolute;
            z-index: 50;

            top: 0;
            left: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            width: 100%;
            height: var(--header-height);

            padding: 20px 24px;

            background: #fbfbfb;

            box-shadow: inset 0 -1px 0 #ecedee;
        }

        .app-header h1 {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: -.5px;

            color: #111827;
        }

        .header-actions {
            display: flex;
            align-items: center;

            gap: 8px;

            height: 24px;
        }

        .icon-button {
            display: grid;

            width: 24px;
            height: 24px;

            flex: 0 0 24px;

            place-items: center;

            background: transparent;
        }

        .header-icon {
            display: block;

            width: 24px;
            height: 24px;

            color: #6b7280;

            transition: color .2s ease;
        }

        .alarm-icon path {
            fill: transparent;

            stroke: currentColor;
            stroke-width: 1.5;

            transition:
                fill .2s ease,
                stroke .2s ease;
        }

        .bag-icon .bag-outline {
            fill: currentColor;
        }

        .bag-icon .bag-fill {
            fill: currentColor;

            opacity: 0;

            transition: opacity .2s ease;
        }

        .icon-button:hover .header-icon {
            color: #ff5a20;
        }

        .icon-button:hover .alarm-icon path {
            fill: currentColor;
        }

        .icon-button:hover .bag-fill {
            opacity: 1;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .mypage-main {
            position: absolute;

            top: var(--header-height);
            right: 0;
            bottom: var(--nav-height);
            left: 0;

            overflow-y: auto;
            overflow-x: hidden;

            background: #ffffff;

            scrollbar-width: none;
        }

        .mypage-main::-webkit-scrollbar {
            display: none;
        }

        .mypage-content {
            width: 100%;

            padding: 24px 24px 40px;
        }


        /* =====================================================
           USER
        ===================================================== */

        .user-info {
            display: flex;
            align-items: center;

            gap: 16px;

            margin-bottom: 24px;
        }

        .user-name {
            font-size: 20px;
            line-height: 24px;

            font-weight: 500;

            color: #111827;
        }

        .user-level {
            font-size: 11px;
            line-height: 16px;

            font-weight: 400;

            color: #6B7280;
        }


        /* =====================================================
           GREEN CARD
        ===================================================== */

        .rescue-card {
            width: 327px;
            height: 96px;

            padding: 12px 8px;

            border-radius: 16px;

            background: #2D7065;

            color: #ffffff;
        }

        .rescue-title {
            display: flex;
            align-items: center;

            gap: 4px;

            margin: 0 0 4px;

            font-size: 22px;
            line-height: 24px;

            font-weight: 500;

            color: #ffffff;
        }

        .rescue-title .leaf {
            display: inline-flex;
            align-items: center;

            line-height: 1;
        }

        .rescue-text {
            width: 100%;

            margin: 0;

            padding-left: 8px;

            font-size: 16px;
            line-height: 20px;

            font-weight: 400;

            color: #ffffff;
        }

        .rescue-text strong {
            font-weight: 500;
        }


        /* =====================================================
           STATS
        ===================================================== */

        .stats {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 8px;

            width: 327px;

            margin-top: 24px;
        }

        .stat-card {
            display: flex;

            align-items: center;
            justify-content: center;

            height: 48px;

            padding: 12px 0;

            border-radius: 8px;

            background: #FFEFE9;

            overflow: hidden;
        }

        .stat-content {
            display: flex;

            align-items: center;

            gap: 4px;

            min-width: 0;
        }

        .stat-icon {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 24px;
            height: 24px;

            flex: 0 0 24px;

            overflow: hidden;
        }

        .stat-icon img {
            display: block;

            width: 24px;
            height: 24px;

            object-fit: contain;
        }

        .stat-info {
            display: flex;

            flex-direction: column;

            justify-content: center;

            min-width: 0;
        }

        .stat-title {
            font-size: 12px;
            line-height: 12px;

            font-weight: 400;

            color: #111827;

            white-space: nowrap;
        }

        .stat-value {
            display: flex;

            align-items: baseline;

            margin-top: 1px;

            color: #FF5A20;
        }

        .stat-number {
            font-size: 13px;
            line-height: 13px;

            font-weight: 500;

            color: #FF5A20;
        }

        .stat-unit {
            margin-left: 1px;

            font-size: 10px;
            line-height: 10px;

            font-weight: 400;

            color: #FF5A20;
        }


        /* =====================================================
           QUICK MENU
        ===================================================== */

        .mypage-quick {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            width: 327px;

            margin-top: 24px;
        }

        .mypage-quick-item {
            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 4px;

            padding: 0;

            background: transparent;
        }

        .mypage-quick-icon {
            display: block;

            width: 24px;
            height: 24px;

            flex: 0 0 24px;

            line-height: 0;

            overflow: hidden;
        }

        .mypage-quick-icon svg {
            display: block;

            width: 24px;
            height: 24px;

            min-width: 24px;
            min-height: 24px;

            max-width: 24px;
            max-height: 24px;
        }

        .quick-outer {
            fill: transparent;

            stroke: #6B7280;
            stroke-width: 1.5;

            stroke-linecap: round;
            stroke-linejoin: round;

            transition:
                fill .2s ease,
                stroke .2s ease;
        }

        .quick-inner {
            fill: #6B7280;

            stroke: none;

            transition: fill .2s ease;
        }

        .mypage-quick-item:hover .quick-outer,
        .mypage-quick-item:focus-visible .quick-outer {
            fill: #FF5A20;

            stroke: #FF5A20;
        }

        .mypage-quick-item:hover .quick-inner,
        .mypage-quick-item:focus-visible .quick-inner {
            fill: #ffffff;
        }

        .mypage-quick-item:hover .quick-heart,
        .mypage-quick-item:focus-visible .quick-heart {
            fill: #FF5A20;

            stroke: #FF5A20;
        }

        .mypage-quick-text {
            font-size: 13px;
            line-height: 16px;

            font-weight: 400;

            color: #111827;

            transition: color .2s ease;
        }

        .mypage-quick-item:hover .mypage-quick-text,
        .mypage-quick-item:focus-visible .mypage-quick-text {
            color: #FF5A20;
        }


        /* =====================================================
           MANAGEMENT
        ===================================================== */

        .management-section {
            width: 327px;
        }

        .account {
            margin-top: 24px;
        }

        .shopping-management,
        .customer-center {
            margin-top: 24px;
        }

        .management-title {
            display: flex;
            align-items: center;

            width: 100%;
            height: 34px;

            padding: 10px 12px;

            border-bottom: 1.5px solid #6B7280;

            background: #ffffff;

            font-family: "Pretendard", sans-serif;

            font-size: 14px;
            line-height: 14px;

            font-weight: 500;

            letter-spacing: 0;

            color: #111827;
        }

        .management-list {
            display: flex;

            width: 100%;

            flex-direction: column;

            gap: 0;

            padding: 0;
            margin: 0;
        }

        .management-item {
            display: flex;

            align-items: center;

            width: 100%;
            height: 32px;

            flex: 0 0 32px;

            padding: 10px 12px;

            border-bottom: .5px solid #ECEDEE;

            background: #ffffff;

            font-family: "Pretendard", sans-serif;

            font-size: 11px;
            line-height: 12px;

            font-weight: 500;

            letter-spacing: 0;

            color: #6B7280;

            text-align: left;

            transition: color .2s ease;
        }

        .management-item:hover,
        .management-item:focus-visible {
            color: var(--main);
        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        .logout-button {
            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;

            width: 327px;
            height: 48px;

            margin-top: 24px;

            padding: 0;

            overflow: visible;

            background: transparent;

            color: #ffffff;

            font-family: "Pretendard", sans-serif;

            font-size: 16px;
            line-height: 20px;

            font-weight: 500;

            letter-spacing: 0;
        }

        .logout-bg {
            position: absolute;

            inset: 0;

            display: block;

            width: 327px;
            height: 48px;

            pointer-events: none;
        }

        .logout-bg path {
            fill: #FF9F7E;

            transition: fill .2s ease;
        }

        .logout-button span {
            position: relative;

            z-index: 1;
        }

        .logout-button:hover .logout-bg path,
        .logout-button:focus-visible .logout-bg path {
            fill: #FF5A20;
        }


        /* =====================================================
           SCROLL TOP
        ===================================================== */

        .scroll-top-button {
            position: absolute;
            z-index: 55;

            right: 24px;
            bottom: calc(var(--nav-height) + 16px);

            display: grid;

            width: 40px;
            height: 40px;

            place-items: center;

            border: 1px solid #ecedee;
            border-radius: 50%;

            color: #6b7280;

            background: rgba(255, 255, 255, .97);

            box-shadow:
                0 4px 14px rgba(35, 42, 51, .12);

            opacity: 0;

            pointer-events: none;

            transform: translateY(8px);

            transition:
                color .2s ease,
                background-color .2s ease,
                opacity .2s ease,
                transform .2s ease;
        }

        .scroll-top-button svg {
            display: block;

            width: 24px;
            height: 24px;

            fill: none;

            stroke: currentColor;
            stroke-width: 1.5;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .scroll-top-button.is-visible {
            opacity: 1;

            pointer-events: auto;

            transform: translateY(0);
        }

        .scroll-top-button:hover,
        .scroll-top-button:focus-visible {
            color: var(--main);

            background: #fff5f1;
        }


        /* =====================================================
           PAGE GUIDE
        ===================================================== */

        .page-guide {
            position: absolute;
            z-index: 80;

            left: 50%;
            bottom: 100px;

            max-width: calc(100% - 48px);

            padding: 10px 16px;

            border-radius: 8px;

            background: rgba(17, 24, 39, .9);

            color: #ffffff;

            font-family: "Pretendard", sans-serif;

            font-size: 12px;
            line-height: 16px;

            font-weight: 400;

            text-align: center;

            white-space: nowrap;

            opacity: 0;
            visibility: hidden;

            transform:
                translateX(-50%)
                translateY(4px);

            pointer-events: none;

            transition:
                opacity .2s ease,
                visibility .2s ease,
                transform .2s ease;
        }

        .page-guide.is-visible {
            opacity: 1;

            visibility: visible;

            transform:
                translateX(-50%)
                translateY(0);
        }


        /* =====================================================
           BOTTOM NAV
        ===================================================== */

        .bottom-nav {
            position: absolute;
            z-index: 60;

            bottom: 0;
            left: 0;

            display: flex;

            width: 375px;
            height: var(--nav-height);

            padding: 0 24px;

            align-items: stretch;
            justify-content: center;

            gap: 50px;

            border-top: 1px solid #eceef1;

            background:
                rgba(255, 255, 255, .97);

            box-shadow:
                0 -5px 16px rgba(35, 42, 51, .035);

            backdrop-filter: blur(12px);
        }

        .nav-item {
            display: flex;

            width: 24px;

            flex: 0 0 24px;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 0;

            color: #6b7280;

            background: transparent;

            font-family: "Pretendard", sans-serif;

            font-size: 10px;

            font-weight: 500;

            white-space: nowrap;

            transition: color .2s ease;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;

            fill: none;

            stroke: currentColor;

            transition:
                fill .2s ease,
                stroke .2s ease;
        }

        .nav-item svg .nav-icon-solid {
            fill: currentColor;

            stroke: none;
        }

        .nav-item.is-active {
            color: var(--main);
        }

        .nav-item.is-active svg {
            fill: currentColor;

            stroke: currentColor;
        }

        .nav-item:hover,
        .nav-item:focus-visible {
            color: var(--main);
        }

        .nav-item:hover svg,
        .nav-item:focus-visible svg {
            fill: currentColor;

            stroke: currentColor;
        }


        /* =====================================================
           ACCESSIBILITY
        ===================================================== */

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid rgba(255, 90, 32, .3);

            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>


<body>

<div class="app-shell">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="app-header">

        <h1>마이페이지</h1>

        <div class="header-actions">

            <a
                class="icon-button"
                href="notification.html"
                aria-label="알림 페이지로 이동"
            >

                <svg
                    class="header-icon alarm-icon"
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                >

                    <path
                        d="M14.7468 18.7496C14.6174 19.2238 14.369 19.6616 14.0154 20.0153C13.4809 20.5497 12.7556 20.8502 11.9998 20.8502C11.2441 20.8501 10.5195 20.5496 9.98511 20.0153C9.63147 19.6616 9.3831 19.2238 9.25366 18.7496H14.7468ZM11.9998 3.15002C13.7104 3.15002 15.3517 3.83006 16.5613 5.03967C17.7706 6.24924 18.45 7.88977 18.45 9.60022V14.2135L19.5183 15.2819C19.5812 15.3448 19.624 15.4251 19.6414 15.5123C19.6587 15.5995 19.6499 15.69 19.616 15.7721C19.5819 15.8543 19.5239 15.9248 19.45 15.9742C19.376 16.0237 19.2889 16.0504 19.2 16.0504H4.80054C4.71163 16.0504 4.62447 16.0236 4.55054 15.9742C4.47655 15.9248 4.41857 15.8543 4.38452 15.7721C4.35052 15.6899 4.34179 15.5996 4.35913 15.5123C4.37649 15.425 4.41926 15.3448 4.48218 15.2819L5.55054 14.2135V9.60022C5.55054 7.8897 6.22976 6.24926 7.43921 5.03967C8.64874 3.83014 10.2892 3.15011 11.9998 3.15002Z"
                    />

                </svg>

            </a>


            <a
                class="icon-button"
                href="cart.html"
                aria-label="장바구니 페이지로 이동"
            >

                <svg
                    class="header-icon bag-icon"
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                >

                    <path
                        class="bag-outline"
                        d="M12 1.5C13.3924 1.5 14.7273 2.05352 15.7119 3.03809C16.6965 4.02265 17.25 5.35761 17.25 6.75V7.5H20.25C20.4473 7.49957 20.6429 7.53862 20.8252 7.61426C21.0072 7.68986 21.1726 7.80057 21.3115 7.94043C21.451 8.07927 21.5615 8.24492 21.6367 8.42676C21.7119 8.60854 21.7506 8.80329 21.75 9V19.1836C21.7495 19.6236 21.6597 20.0594 21.4863 20.4639L21.418 20.6133C21.2489 20.9583 21.0198 21.2713 20.7412 21.5371C20.1086 22.1548 19.2592 22.5003 18.375 22.5H5.625C3.79688 22.5 2.25 20.9531 2.25 19.125V9C2.25 8.65199 2.37124 8.31669 2.58984 8.0498L2.68945 7.93945C2.97076 7.65815 3.35218 7.5 3.75 7.5H6.75V6.75C6.75 5.35761 7.30352 4.02265 8.28809 3.03809C9.27265 2.05352 10.6076 1.5 12 1.5ZM3.75 19.125C3.75 20.1247 4.6253 21 5.625 21H18.375C18.8674 21.0002 19.341 20.8079 19.6934 20.4639L19.6992 20.457L19.7061 20.4512C19.8777 20.2874 20.0139 20.0901 20.1074 19.8721C20.2007 19.6544 20.2495 19.4204 20.25 19.1836V9H3.75V19.125ZM12 3C11.0054 3 10.0519 3.39537 9.34863 4.09863L9.21973 4.2334C8.59706 4.92125 8.25 5.81776 8.25 6.75V7.5H15.75V6.75C15.75 5.81776 15.4029 4.92125 14.7803 4.2334L14.6514 4.09863C13.9481 3.39537 12.9946 3 12 3Z"
                    />

                    <rect
                        class="bag-fill"
                        x="2.25"
                        y="7.5"
                        width="19.5"
                        height="15"
                        rx="3.375"
                    />

                </svg>

            </a>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="mypage-main">

        <div class="mypage-content">


            <!-- USER -->

            <div class="user-info">

                <strong class="user-name">
                    권그린
                </strong>

                <span class="user-level">
                    Newbie
                </span>

            </div>


            <!-- GREEN CARD -->

            <section class="rescue-card">

                <div class="rescue-title">

                    <span
                        class="leaf"
                        aria-hidden="true"
                    >
                        🌱
                    </span>

                    <span>
                        권그린님!
                    </span>

                </div>

                <p class="rescue-text">
                    이번 주 구조한 농산물은 <strong>3.2kg</strong> 입니다.<br>
                    탄소 <strong>5.1kg</strong>을 절감했어요!
                </p>

            </section>


            <!-- =====================================================
                 STATS
                 첨부 아이콘 적용
            ====================================================== -->

            <section
                class="stats"
                aria-label="환경 기여 통계"
            >


                <!-- 구출 농산물 -->

                <div class="stat-card">

                    <div class="stat-content">

<script>
    document.addEventListener("DOMContentLoaded", () => {

        /* =====================================================
           메인 컨텐츠
           실제 페이지 이동 없이 안내만 표시
        ===================================================== */

        const mainButtons =
            document.querySelectorAll(
                ".mypage-main [data-page-name]"
            );

        const pageGuide =
            document.getElementById("pageGuide");

        let guideTimer = null;


        mainButtons.forEach(button => {

            button.addEventListener("click", () => {

                const pageName =
                    button.dataset.pageName;

                pageGuide.textContent =
                    `${pageName} 페이지로 이동합니다.`;

                pageGuide.classList.add(
                    "is-visible"
                );


                clearTimeout(
                    guideTimer
                );


                guideTimer =
                    setTimeout(() => {

                        pageGuide.classList.remove(
                            "is-visible"
                        );

                    }, 1600);

            });

        });


        /* =====================================================
           올라가기 버튼
        ===================================================== */

        const mainScroll =
            document.querySelector(".mypage-main");

        const scrollTopButton =
            document.querySelector(".scroll-top-button");


        function scrollMyPageToTop() {

            const reduceMotion =
                window
                    .matchMedia(
                        "(prefers-reduced-motion: reduce)"
                    )
                    .matches;

            mainScroll.scrollTo({
                top: 0,
                behavior:
                    reduceMotion
                        ? "auto"
                        : "smooth"
            });

        }


        scrollTopButton.addEventListener(
            "click",
            scrollMyPageToTop
        );


        function updateScrollTopButton() {

            const isVisible =
                mainScroll.scrollTop > 200;

            scrollTopButton.classList.toggle(
                "is-visible",
                isVisible
            );

            scrollTopButton.setAttribute(
                "aria-hidden",
                String(!isVisible)
            );

            scrollTopButton.tabIndex =
                isVisible ? 0 : -1;

        }


        mainScroll.addEventListener(
            "scroll",
            updateScrollTopButton,
            { passive: true }
        );


        updateScrollTopButton();

    });
</script>
