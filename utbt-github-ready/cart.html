<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니</title>

    <style>
        @charset "UTF-8";

        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");

        :root {
            --main: #FF5A20;
            --main-light: #FFEFE9;
            --background: #ECEDEE;
            --white: #FFFFFF;
            --text: #111827;
            --sub-text: #6B7280;
            --line: #E6EEEC;
            --check-line: #CACCD1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: "Pretendard", sans-serif;
            color: #111827;
            background: #D8D8D8;
        }

        button,
        input {
            font-family: "Pretendard", sans-serif;
        }

        button {
            padding: 0;
            border: 0;
            outline: 0;
            background: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* ========================================
           APP
        ======================================== */

        .app {
            position: relative;
            width: 375px;
            height: 812px;
            margin: 0 auto;
            overflow: hidden;
            background: #ECEDEE;
        }

        /* ========================================
           HEADER
        ======================================== */

        .header {
            position: absolute;
            z-index: 50;
            top: 0;
            left: 0;

            width: 100%;
            height: 64px;

            display: flex;
            align-items: center;

            padding: 8px 24px;

            background: #FFFFFF;
        }

        .back-button {
            width: 24px;
            height: 48px;
            flex: 0 0 24px;

            display: grid;
            place-items: center;

            margin-right: 8px;

            color: #6B7280;

            transition: color 0.2s ease;
        }

        .back-button:hover,
        .back-button:focus-visible {
            color: #FF5A20;
        }

        .back-button svg {
            display: block;

            width: 24px;
            height: 24px;

            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            line-height: 24px;

            letter-spacing: -0.4px;

            color: #111827;
        }

        /* ========================================
           MAIN
        ======================================== */

        .main {
            width: 100%;
            height: 100%;

            padding: 88px 24px 168px;

            overflow-y: auto;

            scrollbar-width: none;
        }

        .main::-webkit-scrollbar {
            display: none;
        }

        /* ========================================
           MAIN CARD
        ======================================== */

        .cart-card {
            width: 327px;

            padding: 8px 12px;

            border-radius: 8px;

            background: #FFFFFF;
        }

        /* ========================================
           DELIVERY INFO
        ======================================== */

        .delivery-info {
            padding-top: 16px;
            padding-bottom: 24px;

            border-bottom: 0.5px solid #E6EEEC;
        }

        /* ========================================
           DELIVERY BADGE
        ======================================== */

        .delivery-badge {
            width: 65px;
            height: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 10px;

            border-radius: 99px;

            background: #FFEFE9;

            font-size: 13px;
            font-weight: 500;
            line-height: 1;

            color: #FF5A20;

            white-space: nowrap;
        }

        /* ========================================
           ADDRESS
        ======================================== */

        .address-row {
            width: 303px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: 14px;
        }

        .address {
            flex: 1;
            min-width: 0;

            font-size: 13px;
            font-weight: 400;
            line-height: 16px;

            color: #111827;
        }

        /* ========================================
           CHANGE
        ======================================== */

        .change-address {
            width: 43px;
            height: 24px;

            flex: 0 0 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 10px;

            border-radius: 16px;

            background: #E6EEEC;

            font-size: 13px;
            font-weight: 400;
            line-height: 1;

            color: #111827;

            white-space: nowrap;

            transition: background-color 0.2s ease;
        }

        .change-address:hover {
            background: #DCE7E4;
        }

        /* ========================================
           CHECKBOX
           로그인 페이지 체크박스 기준
        ======================================== */

        .check-label {
            position: relative;

            display: flex;
            align-items: center;

            cursor: pointer;
            user-select: none;

            -webkit-tap-highlight-color: transparent;
        }

        .check-label input {
            position: absolute;

            width: 24px;
            height: 24px;

            margin: 0;

            opacity: 0;

            cursor: pointer;
        }

        .checkbox-ui {
            position: relative;

            display: block;

            width: 24px;
            height: 24px;

            flex: 0 0 24px;

            pointer-events: none;
        }

        .checkbox-ui svg {
            display: block;

            width: 24px;
            height: 24px;

            overflow: visible;
        }

        .checkbox-shell {
            fill: #FFFFFF;

            stroke: #CACCD1;
            stroke-width: 1.5;

            stroke-linecap: round;
            stroke-linejoin: round;

            transition:
                fill 0.18s ease,
                stroke 0.18s ease;
        }

        .checkbox-tick {
            fill: none;

            stroke: #FFFFFF;
            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;

            opacity: 0;

            transform-origin: center;
            transform: scale(0.8);

            transition:
                opacity 0.15s ease,
                transform 0.15s ease;
        }

        .check-label input:checked + .checkbox-ui .checkbox-shell {
            fill: #FF5A20;
            stroke: #FF5A20;
        }

        .check-label input:checked + .checkbox-ui .checkbox-tick {
            opacity: 1;
            transform: scale(1);
        }

        .check-label input:focus-visible + .checkbox-ui {
            outline: 2px solid rgba(255, 90, 32, 0.18);
            outline-offset: 2px;

            border-radius: 50%;
        }

        /* ========================================
           SELECT ALL
        ======================================== */

        .select-all-row {
            width: 303px;
            height: 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: 24px;
        }

        .select-all-label {
            gap: 8px;
        }

        .check-text {
            font-size: 13px;
            font-weight: 400;
            line-height: 24px;

            color: #111827;
        }

        /* ========================================
           OUTLINE DELIVERY BADGE
        ======================================== */

        .delivery-outline {
            width: 65px;
            height: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 10px;

            border: 1px solid #6B7280;
            border-radius: 99px;

            background: #FFFFFF;

            font-size: 13px;
            font-weight: 500;
            line-height: 1;

            color: #111827;

            white-space: nowrap;
        }

        /* ========================================
           TITLE
        ======================================== */

        .delivery-title-area {
            width: 303px;

            margin-top: 24px;
            padding-bottom: 24px;

            border-bottom: 0.5px solid #E6EEEC;
        }

        .cart-section-title {
            margin: 0;
            padding: 0;

            font-size: 16px;
            font-weight: 500;
            line-height: 20px;

            color: #111827;
        }

        /* ========================================
           PRODUCT LIST
        ======================================== */

        .product-list {
            width: 300px;

            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        /* ========================================
           PRODUCT
        ======================================== */

        .product {
            position: relative;

            width: 300px;
            height: 144px;

            padding: 24px 0;
        }

        /* ========================================
           PRODUCT CHECKBOX
        ======================================== */

        .product-check {
            position: absolute;

            top: 24px;
            left: 0;

            width: 24px;
            height: 24px;
        }

        /* ========================================
           PRODUCT IMAGE

           img 태그 사용
           96 × 96
           radius 8
        ======================================== */

        .product-image {
            position: absolute;

            top: 24px;
            left: 32px;

            width: 96px;
            height: 96px;

            overflow: hidden;

            border-radius: 8px;

            background: #E6E6E6;
        }

        .product-image img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;
        }

        /* ========================================
           PRODUCT DETAIL
        ======================================== */

        .product-detail {
            position: absolute;

            top: 24px;
            left: 152px;

            width: 115px;
            height: 96px;

            text-align: left;
        }

        /* ========================================
           PRODUCT NAME
        ======================================== */

        .product-name {
            width: 115px;

            margin: 0;

            overflow: hidden;

            font-size: 16px;
            font-weight: 400;
            line-height: 19px;

            color: #111827;

            text-align: left;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* ========================================
           PRICE
        ======================================== */

        .product-price {
            width: 115px;

            margin-top: 4px;

            font-size: 16px;
            font-weight: 600;
            line-height: 19px;

            color: #111827;

            text-align: left;
        }

        /* ========================================
           QUANTITY
        ======================================== */

        .quantity {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 78px;
            height: 24px;

            display: flex;
            align-items: center;

            border-radius: 999px;

            background: #FFEFE9;
        }

        .quantity button {
            width: 24px;
            height: 24px;

            flex: 0 0 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #FF5A20;
        }

        .quantity button:hover {
            color: #D9430E;
        }

        .quantity button svg {
            display: block;

            width: 16px;
            height: 16px;

            fill: none;

            stroke: currentColor;
            stroke-width: 1.5;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .quantity-value {
            width: 14px;

            flex: 0 0 14px;

            margin: 0 8px;

            font-size: 16px;
            font-weight: 600;
            line-height: 24px;

            color: #111827;

            text-align: center;
        }

        /* ========================================
           REMOVE
        ======================================== */

        .remove-button {
            position: absolute;

            top: 24px;
            right: 0;

            width: 16px;
            height: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #111827;
        }

        .remove-button svg {
            display: block;

            width: 16px;
            height: 16px;
        }

        .remove-button:hover {
            color: #FF5A20;
        }

        /* ========================================
           PRODUCT LINE
        ======================================== */

        .product::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 0.5px;

            background: #E6EEEC;
        }

        .product:last-child::after {
            display: none;
        }

        /* ========================================
           EMPTY
        ======================================== */

        .empty-cart {
            display: none;

            padding: 80px 20px;

            text-align: center;

            font-size: 14px;
            font-weight: 400;
            line-height: 20px;

            color: #969BA5;
        }

        .cart-card.is-empty .delivery-title-area,
        .cart-card.is-empty .product-list {
            display: none;
        }

        .cart-card.is-empty .empty-cart {
            display: block;
        }

        /* ========================================
           PURCHASE
        ======================================== */

        .purchase-area {
            position: absolute;
            z-index: 20;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 88px;

            padding: 10px 24px 14px;

            background: #ECEDEE;
        }

        .purchase-button {
            position: relative;

            width: 327px;
            height: 48px;

            font-size: 16px;
            font-weight: 500;

            color: #FFFFFF;
        }

        .purchase-shape {
            position: absolute;
            z-index: -1;

            inset: 0;

            width: 100%;
            height: 100%;
        }

        .purchase-button:hover .purchase-shape path {
            fill: #E84D18;
        }

        .purchase-button:active {
            transform: translateY(1px);
        }

        /* ========================================
           TOAST
        ======================================== */

        .toast {
            position: absolute;
            z-index: 100;

            left: 50%;
            bottom: 102px;

            padding: 10px 16px;

            border-radius: 8px;

            background: rgba(17, 24, 39, 0.88);

            font-size: 13px;
            font-weight: 400;

            color: #FFFFFF;

            opacity: 0;

            pointer-events: none;

            white-space: nowrap;

            transform: translate(-50%, 10px);

            transition:
                opacity 0.22s ease,
                transform 0.22s ease;
        }

        .toast.show {
            opacity: 1;

            transform: translate(-50%, 0);
        }

        @media (max-width: 375px) {
            .app {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <button
            class="back-button"
            id="backButton"
            type="button"
            aria-label="뒤로가기"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 5L8 12L15 19"/>
            </svg>
        </button>

        <h1 class="header-title">
            장바구니
        </h1>

    </header>


    <!-- MAIN -->

    <main class="main">

        <section
            class="cart-card"
            id="cartCard"
        >

            <!-- 배송지 -->

            <div class="delivery-info">

                <span class="delivery-badge">
                    새벽배송
                </span>

                <div class="address-row">

                    <p class="address">
                        서울특별시 종로구 대학로 123,<br>
                        101동 502호 (혜화아파트)
                    </p>

                    <button
                        class="change-address"
                        id="changeAddress"
                        type="button"
                    >
                        변경
                    </button>

                </div>

            </div>


            <!-- 전체선택 -->

            <div class="select-all-row">

                <label class="check-label select-all-label">

                    <input
                        type="checkbox"
                        id="selectAll"
                        aria-label="전체선택"
                    >

                    <span class="checkbox-ui" aria-hidden="true">

                        <svg viewBox="0 0 24 24">

                            <path
                                class="checkbox-shell"
                                d="
                                    M12 1.3
                                    C15.5 1.1 18.8 2.4 21 5.2
                                    C23.1 7.9 23.2 11.2 22.6 14.6
                                    C22.1 18 20.1 20.8 16.9 22.1
                                    C13.8 23.4 10.1 23.2 7 21.8
                                    C3.8 20.4 1.7 17.5 1.4 14
                                    C1.1 10.6 2.1 7.1 4.6 4.6
                                    C6.6 2.6 9.2 1.5 12 1.3
                                    Z
                                "
                            />

                            <path
                                class="checkbox-tick"
                                d="M7.2 11.9L10.5 15.2L17 8.5"
                            />

                        </svg>

                    </span>

                    <span class="check-text">
                        전체선택
                    </span>

                </label>

                <span class="delivery-outline">
                    새벽배송
                </span>

            </div>


            <!-- 큰 타이틀 -->

            <div class="delivery-title-area">

                <h2 class="cart-section-title">
                    새벽배송
                </h2>

            </div>


            <!-- PRODUCTS -->

            <div
                class="product-list"
                id="productList"
            >

                <!-- APPLE -->

                <article
                    class="product"
                    data-product-id="apple"
                    data-price="7900"
                >

                    <label
                        class="check-label product-check"
                        aria-label="못난이 사과 선택"
                    >

                        <input
                            type="checkbox"
                            class="item-check"
                        >

                        <span class="checkbox-ui" aria-hidden="true">

                            <svg viewBox="0 0 24 24">

                                <path
                                    class="checkbox-shell"
                                    d="
                                        M12 1.3
                                        C15.5 1.1 18.8 2.4 21 5.2
                                        C23.1 7.9 23.2 11.2 22.6 14.6
                                        C22.1 18 20.1 20.8 16.9 22.1
                                        C13.8 23.4 10.1 23.2 7 21.8
                                        C3.8 20.4 1.7 17.5 1.4 14
                                        C1.1 10.6 2.1 7.1 4.6 4.6
                                        C6.6 2.6 9.2 1.5 12 1.3
                                        Z
                                    "
                                />

                                <path
                                    class="checkbox-tick"
                                    d="M7.2 11.9L10.5 15.2L17 8.5"
                                />

                            </svg>

                        </span>

                    </label>

                    <div class="product-image">

                        <img
                            src="https://ch1156ae-sketch.github.io/new/home_image/%EC%82%AC%EA%B3%BC.jpg"
                            alt="못난이 사과 1.5kg"
                        >

                    </div>


                    <div class="product-detail">

                        <p class="product-name">
                            못난이 사과 1.5kg
                        </p>

                        <p class="product-price">
                            7,900원
                        </p>

                        <div class="quantity">

                            <button
                                type="button"
                                class="minus"
                                aria-label="못난이 사과 수량 감소"
                            >
                                <svg viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M4 8H12"/>
                                </svg>
                            </button>

                            <span class="quantity-value">
                                1
                            </span>

                            <button
                                type="button"
                                class="plus"
                                aria-label="못난이 사과 수량 증가"
                            >
                                <svg viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M4 8H12"/>
                                    <path d="M8 4V12"/>
                                </svg>
                            </button>

                        </div>

                    </div>


                    <button
                        class="remove-button"
                        type="button"
                        aria-label="못난이 사과 삭제"
                    >
                        <svg
                            viewBox="0 0 16 16"
                            fill="none"
                            aria-hidden="true"
                        >
                            <path
                                d="M3.5 3.5L12.5 12.5M12.5 3.5L3.5 12.5"
                                stroke="currentColor"
                                stroke-width="1.4"
                                stroke-linecap="round"
                            />
                        </svg>
                    </button>

                </article>


                <!-- CUCUMBER -->

                <article
                    class="product"
                    data-product-id="cucumber"
                    data-price="9000"
                >

                    <label
                        class="check-label product-check"
                        aria-label="못난이 오이 선택"
                    >

                        <input
                            type="checkbox"
                            class="item-check"
                        >

                        <span class="checkbox-ui" aria-hidden="true">

                            <svg viewBox="0 0 24 24">

                                <path
                                    class="checkbox-shell"
                                    d="
                                        M12 1.3
                                        C15.5 1.1 18.8 2.4 21 5.2
                                        C23.1 7.9 23.2 11.2 22.6 14.6
                                        C22.1 18 20.1 20.8 16.9 22.1
                                        C13.8 23.4 10.1 23.2 7 21.8
                                        C3.8 20.4 1.7 17.5 1.4 14
                                        C1.1 10.6 2.1 7.1 4.6 4.6
                                        C6.6 2.6 9.2 1.5 12 1.3
                                        Z
                                    "
                                />

                                <path
                                    class="checkbox-tick"
                                    d="M7.2 11.9L10.5 15.2L17 8.5"
                                />

                            </svg>

                        </span>

                    </label>


                    <div class="product-image">

                        <img
                            src="https://ch1156ae-sketch.github.io/new/home_image/%EC%98%A4%EC%9D%B4.jpg"
                            alt="못난이 오이 5입"
                        >

                    </div>


                    <div class="product-detail">

                        <p class="product-name">
                            못난이 오이 5입
                        </p>

                        <p class="product-price">
                            9,000원
                        </p>

                        <div class="quantity">

                            <button
                                type="button"
                                class="minus"
                                aria-label="못난이 오이 수량 감소"
                            >
                                <svg viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M4 8H12"/>
                                </svg>
                            </button>

                            <span class="quantity-value">
                                2
                            </span>

                            <button
                                type="button"
                                class="plus"
                                aria-label="못난이 오이 수량 증가"
                            >
                                <svg viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M4 8H12"/>
                                    <path d="M8 4V12"/>
                                </svg>
                            </button>

                        </div>

                    </div>


                    <button
                        class="remove-button"
                        type="button"
                        aria-label="못난이 오이 삭제"
                    >
                        <svg
                            viewBox="0 0 16 16"
                            fill="none"
                            aria-hidden="true"
                        >
                            <path
                                d="M3.5 3.5L12.5 12.5M12.5 3.5L3.5 12.5"
                                stroke="currentColor"
                                stroke-width="1.4"
                                stroke-linecap="round"
                            />
                        </svg>
                    </button>

                </article>

            </div>


            <div class="empty-cart">
                장바구니에 담긴 상품이 없습니다.
            </div>

        </section>

    </main>


    <!-- PURCHASE -->

    <div class="purchase-area">

        <button
            type="button"
            class="purchase-button"
            id="purchaseButton"
        >

            <svg
                class="purchase-shape"
                viewBox="0 0 327 48"
                preserveAspectRatio="none"
                aria-hidden="true"
            >
                <path
                    d="
                        M7 1
                        C31 2 44 1 68 1
                        C91 1 110 2 134 2
                        C165 2 193 1 223 1
                        C255 1 282 3 315 1
                        C322 0 327 3 327 9
                        L326 38
                        C326 44 322 47 316 47
                        C294 46 278 45 256 46
                        C232 47 209 46 186 47
                        C159 48 133 47 105 48
                        C83 48 61 44 39 45
                        L8 47
                        C2 47 0 43 1 38
                        L4 24
                        L1 11
                        C0 5 2 1 7 1
                        Z
                    "
                    fill="#FF5A20"
                />
            </svg>

            구매하기

        </button>

    </div>


    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    ></div>

</div>


<script>
    const selectAll =
        document.getElementById("selectAll");

    const productList =
        document.getElementById("productList");

    const cartCard =
        document.getElementById("cartCard");

    const purchaseButton =
        document.getElementById("purchaseButton");

    const changeAddress =
        document.getElementById("changeAddress");

    const backButton =
        document.getElementById("backButton");

    const toast =
        document.getElementById("toast");

    let toastTimer = null;


    /* =========================================
       TOAST
    ========================================== */

    function showToast(message) {

        clearTimeout(toastTimer);

        toast.textContent = message;

        toast.classList.add("show");

        toastTimer = setTimeout(() => {

            toast.classList.remove("show");

        }, 1600);
    }


    /* =========================================
       CHECKBOX
    ========================================== */

    function getItemChecks() {

        return [
            ...document.querySelectorAll(
                ".product .item-check"
            )
        ];
    }


    function updateSelectAll() {

        const checks =
            getItemChecks();

        if (!checks.length) {

            selectAll.checked = false;

            return;
        }

        selectAll.checked =
            checks.every(
                checkbox =>
                    checkbox.checked
            );
    }


    /* =========================================
       SELECT ALL
    ========================================== */

    selectAll.addEventListener(
        "change",
        () => {

            getItemChecks().forEach(
                checkbox => {

                    checkbox.checked =
                        selectAll.checked;
                }
            );
        }
    );


    /* =========================================
       INDIVIDUAL CHECK
    ========================================== */

    productList.addEventListener(
        "change",
        event => {

            if (
                event.target.classList.contains(
                    "item-check"
                )
            ) {

                updateSelectAll();
            }
        }
    );


    /* =========================================
       PRODUCT
    ========================================== */

    productList.addEventListener(
        "click",
        event => {

            const product =
                event.target.closest(
                    ".product"
                );

            if (!product) {
                return;
            }


            /* MINUS */

            const minus =
                event.target.closest(
                    ".minus"
                );

            if (minus) {

                const value =
                    product.querySelector(
                        ".quantity-value"
                    );

                let quantity =
                    Number(
                        value.textContent
                    );

                if (quantity > 1) {

                    quantity--;

                    value.textContent =
                        quantity;
                }

                return;
            }


            /* PLUS */

            const plus =
                event.target.closest(
                    ".plus"
                );

            if (plus) {

                const value =
                    product.querySelector(
                        ".quantity-value"
                    );

                let quantity =
                    Number(
                        value.textContent
                    );

                quantity++;

                value.textContent =
                    quantity;

                return;
            }


            /* REMOVE */

            const remove =
                event.target.closest(
                    ".remove-button"
                );

            if (remove) {

                product.style.transition =
                    "opacity .2s ease, transform .2s ease";

                product.style.opacity =
                    "0";

                product.style.transform =
                    "translateX(10px)";

                setTimeout(
                    () => {

                        product.remove();

                        updateSelectAll();

                        checkEmptyCart();

                    },
                    200
                );
            }
        }
    );


    /* =========================================
       EMPTY
    ========================================== */

    function checkEmptyCart() {

        const products =
            document.querySelectorAll(
                ".product"
            );

        cartCard.classList.toggle(
            "is-empty",
            products.length === 0
        );
    }


    /* =========================================
       PURCHASE
    ========================================== */

    purchaseButton.addEventListener(
        "click",
        () => {

            const products = [
                ...document.querySelectorAll(
                    ".product"
                )
            ];

            const selected =
                products.filter(
                    product =>
                        product
                            .querySelector(
                                ".item-check"
                            )
                            .checked
                );

            if (!selected.length) {

                showToast(
                    "구매할 상품을 선택해주세요."
                );

                return;
            }


            let totalPrice = 0;
            let totalQuantity = 0;


            selected.forEach(
                product => {

                    const price =
                        Number(
                            product.dataset.price
                        );

                    const quantity =
                        Number(
                            product
                                .querySelector(
                                    ".quantity-value"
                                )
                                .textContent
                        );

                    totalPrice +=
                        price * quantity;

                    totalQuantity +=
                        quantity;
                }
            );


            showToast(
                `선택 상품 ${totalQuantity}개 · ${totalPrice.toLocaleString()}원`
            );
        }
    );


    /* =========================================
       ADDRESS
    ========================================== */

    changeAddress.addEventListener(
        "click",
        () => {

            showToast(
                "배송지 변경 페이지로 이동합니다."
            );
        }
    );


    /* =========================================
       BACK
    ========================================== */

    backButton.addEventListener(
        "click",
        () => {

            if (window.history.length > 1) {

                window.history.back();

            } else {

                window.location.href =
                    "index.html";
            }
        }
    );


    /* =========================================
       INITIAL
    ========================================== */

    selectAll.checked = false;

    getItemChecks().forEach(
        checkbox => {

            checkbox.checked = false;
        }
    );

    updateSelectAll();
    checkEmptyCart();
</script>

</body>
</html>
