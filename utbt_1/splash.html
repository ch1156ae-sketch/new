<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UTBT 시작 안내</title>
        <link rel="stylesheet" href="./css/splash.css" />
    </head>

    <body>
        <main class="splash" aria-label="UTBT 시작 안내">
            <div class="slides" aria-live="polite">
                <section class="slide is-active" aria-label="1 / 3">
                    <div class="slide__content">
                        <div class="slide__text">
                            <h1 class="slide__title">
                                못생겼다고<br />
                                버려질 이유는 없어요
                            </h1>

                            <p class="slide__description">
                                모양은 조금 달라도 맛과 영양은 그대로예요
                            </p>
                        </div>

                        <img
                            class="slide__image"
                            src="./images/page01.png"
                            width="327"
                            height="327"
                            alt="못난이 농산물 캐릭터"
                        />
                    </div>

                    <div class="slide__footer">
                        <div
                            class="pagination"
                            aria-label="스플래시 페이지"
                        >
                            <button
                                class="dot is-active"
                                type="button"
                                data-index="0"
                                aria-label="1번 화면"
                                aria-current="page"
                            ></button>

                            <button
                                class="dot"
                                type="button"
                                data-index="1"
                                aria-label="2번 화면"
                            ></button>

                            <button
                                class="dot"
                                type="button"
                                data-index="2"
                                aria-label="3번 화면"
                            ></button>
                        </div>

                        <button class="skip-button" type="button">
                            Skip
                        </button>
                    </div>
                </section>

                <section
                    class="slide"
                    aria-label="2 / 3"
                    aria-hidden="true"
                >
                    <div class="slide__content">
                        <div class="slide__text">
                            <h1 class="slide__title">
                                못난이 농산물의<br />
                                진짜 가치를 발견하세요
                            </h1>

                            <p class="slide__description">
                                버려질 농산물을 합리적인 가격으로 만나보세요
                            </p>
                        </div>

                        <img
                            class="slide__image"
                            src="./images/page02.png"
                            width="327"
                            height="327"
                            alt="농산물을 소개하는 캐릭터"
                        />
                    </div>

                    <div class="slide__footer">
                        <div
                            class="pagination"
                            aria-label="스플래시 페이지"
                        >
                            <button
                                class="dot"
                                type="button"
                                data-index="0"
                                aria-label="1번 화면"
                            ></button>

                            <button
                                class="dot is-active"
                                type="button"
                                data-index="1"
                                aria-label="2번 화면"
                                aria-current="page"
                            ></button>

                            <button
                                class="dot"
                                type="button"
                                data-index="2"
                                aria-label="3번 화면"
                            ></button>
                        </div>

                        <button class="skip-button" type="button">
                            Skip
                        </button>
                    </div>
                </section>

                <section
                    class="slide slide--final"
                    aria-label="3 / 3"
                    aria-hidden="true"
                >
                    <div class="slide__content">
                        <div class="slide__text">
                            <h1 class="slide__title">
                                못난이 농산물 마켓 울퉁불퉁
                            </h1>

                            <p class="slide__description">
                                신선한 농산물을 더 착한 가격으로 구입해 보세요
                            </p>
                        </div>

                        <img
                            class="slide__image"
                            src="./images/page03.png"
                            width="327"
                            height="327"
                            alt="농산물이 담긴 나무 상자"
                        />
                    </div>

                    <a class="login-button" href="login.html">
                        <span>로그인</span>
                    </a>
                </section>
            </div>
        </main>

        <script src="./js/splash.js"></script>
    </body>
</html>
