<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹사이트 변경 안내</title>
    <style>
        /* 기본 리셋 및 배경 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 안내창 카드 스타일 */
        .notice-container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 450px;
            width: 90%;
            transition: opacity 0.3s ease;
        }

        /* 아이콘 */
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        /* 타이틀 및 본문 텍스트 */
        h1 {
            color: #1a1a1a;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        p {
            color: #666666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* 확인 버튼 */
        .close-btn {
            display: inline-block;
            background-color: #28a745; /* 안정감을 주는 초록색 톤 */
            color: #ffffff;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
        }
        .close-btn:hover {
            background-color: #218838;
        }

        /* 닫힘 애니메이션용 클래스 */
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="notice-container" id="noticeBox">
        <div class="icon">✨</div>
        <h1>웹사이트 업데이트 안내</h1>
        <p>
            새로운 기능 추가 및 서비스 개선을 위해<br>
            <strong>웹사이트의 일부 내용과 UI가 변경되었습니다.</strong><br><br>
            이용 중 변경된 점이 있더라도 당황하지 마시고<br>
            기존처럼 편리하게 서비스를 이용해 보세요!
        </p>
        <button class="close-btn" onclick="closeNotice()">확인했습니다</button>
    </div>

    <script>
        function closeNotice() {
            const noticeBox = document.getElementById('noticeBox');
            
            // 안내창을 부드럽게 사라지게 합니다.
            noticeBox.style.opacity = '0';
            
            // 완전히 사라진 후 요소를 화면에서 숨깁니다.
            setTimeout(() => {
                noticeBox.style.display = 'none';
            }, 300);
        }
    </script>

</body>
</html>
