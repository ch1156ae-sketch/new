<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니</title>
    <link rel="stylesheet" href="./css/cart.css">

</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <button
            class="back-button"
            id="backButton"
            type="button"
            aria-label="뒤로가기"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 5L8 12L15 19"/>
            </svg>
        </button>

        <h1 class="header-title">
            장바구니
        </h1>

    </header>


    <!-- MAIN -->

    <main class="main">

        <section
            class="cart-card"
            id="cartCard"
        >

            <!-- 배송지 -->

            <div class="delivery-info">

                <span class="delivery-badge">
                    새벽배송
                </span>

                <div class="address-row">

                    <p class="address">
                        서울특별시 종로구 대학로 123,<br>
                        101동 502호 (혜화아파트)
                    </p>

                    <button
                        class="change-address"
                        id="changeAddress"
                        type="button"
                    >
                        변경
                    </button>

                </div>

            </div>


            <!-- 전체선택 -->

            <div class="select-all-row">

                <label class="check-label select-all-label">

                    <input
                        type="checkbox"
                        id="selectAll"
                        aria-label="전체선택"
                    >

                    <span class="checkbox-ui" aria-hidden="true">

                        <svg viewBox="0 0 24 24">

                            <path
                                class="checkbox-shell"
                                d="
                                    M12 1.3
                                    C15.5 1.1 18.8 2.4 21 5.2
                                    C23.1 7.9 23.2 11.2 22.6 14.6
                                    C22.1 18 20.1 20.8 16.9 22.1
                                    C13.8 23.4 10.1 23.2 7 21.8
                                    C3.8 20.4 1.7 17.5 1.4 14
                                    C1.1 10.6 2.1 7.1 4.6 4.6
                                    C6.6 2.6 9.2 1.5 12 1.3
                                    Z
                                "
                            />

                            <path
                                class="checkbox-tick"
                                d="M7.2 11.9L10.5 15.2L17 8.5"
                            />

                        </svg>

                    </span>

                    <span class="check-text">
                        전체선택
                    </span>

                </label>

                <span class="delivery-outline">
                    새벽배송
                </span>

            </div>


            <!-- 큰 타이틀 -->

            <div class="delivery-title-area">

                <h2 class="cart-section-title">
                    새벽배송
                </h2>

            </div>


            <!-- PRODUCTS -->

            <div
                class="product-list"
                id="productList"
            >

                <!-- APPLE -->

                <article
                    class="product"
                    data-product-id="apple"
                    data-price="7900"
                >

                    <label
                        class="check-label product-check"
                        aria-label="못난이 사과 선택"
                    >

                        <input
                            type="checkbox"
                            class="item-check"
                        >

                        <span class="checkbox-ui" aria-hidden="true">

                            <svg viewBox="0 0 24 24">

                                <path
                                    class="checkbox-shell"
                                    d="
                                        M12 1.3
                                        C15.5 1.1 18.8 2.4 21 5.2
                                        C23.1 7.9 23.2 11.2 22.6 14.6
                                        C22.1 18 20.1 20.8 16.9 22.1
                                        C13.8 23.4 10.1 23.2 7 21.8
                                        C3.8 20.4 1.7 17.5 1.4 14
                                        C1.1 10.6 2.1 7.1 4.6 4.6
                                        C6.6 2.6 9.2 1.5 12 1.3
                                        Z
                                    "
                                />

                                <path
                                    class="checkbox-tick"
                                    d="M7.2 11.9L10.5 15.2L17 8.5"
                                />

                            </svg>

                        </span>

                    </label>

                    <div class="product-image">

                        <img
                            src="https://ch1156ae-sketch.github.io/new/home_image/%EC%82%AC%EA%B3%BC.jpg"
                            alt="못난이 사과 1.5kg"
                        >

                    </div>


                    <div class="product-detail">

                        <p class="product-name">
                            못난이 사과 1.5kg
                        </p>

                        <p class="product-price">
                            7,900원
                        </p>

                        <div class="quantity">

                            <button
                                type="button"
                                class="minus"
                                aria-label="못난이 사과 수량 감소"
                            >
                                <svg viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M4 8H12"/>
                                </svg>
                            </button>

                            <span class="quantity-value">
                                1
                            </span>

                            <button
                                type="button"
                                class="plus"
                                aria-label="못난이 사과 수량 증가"
                            >
                                <svg viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M4 8H12"/>
                                    <path d="M8 4V12"/>
                                </svg>
                            </button>

                        </div>

                    </div>


                    <button
                        class="remove-button"
                        type="button"
                        aria-label="못난이 사과 삭제"
                    >
                        <svg
                            viewBox="0 0 16 16"
                            fill="none"
                            aria-hidden="true"
                        >
                            <path
                                d="M3.5 3.5L12.5 12.5M12.5 3.5L3.5 12.5"
                                stroke="currentColor"
                                stroke-width="1.4"
                                stroke-linecap="round"
                            />
                        </svg>
                    </button>

                </article>


                <!-- CUCUMBER -->

                <article
                    class="product"
                    data-product-id="cucumber"
                    data-price="9000"
                >

                    <label
                        class="check-label product-check"
                        aria-label="못난이 오이 선택"
                    >

                        <input
                            type="checkbox"
                            class="item-check"
                        >

                        <span class="checkbox-ui" aria-hidden="true">

                            <svg viewBox="0 0 24 24">

                                <path
                                    class="checkbox-shell"
                                    d="
                                        M12 1.3
                                        C15.5 1.1 18.8 2.4 21 5.2
                                        C23.1 7.9 23.2 11.2 22.6 14.6
                                        C22.1 18 20.1 20.8 16.9 22.1
                                        C13.8 23.4 10.1 23.2 7 21.8
                                        C3.8 20.4 1.7 17.5 1.4 14
                                        C1.1 10.6 2.1 7.1 4.6 4.6
                                        C6.6 2.6 9.2 1.5 12 1.3
                                        Z
                                    "
                                />

                                <path
                                    class="checkbox-tick"
                                    d="M7.2 11.9L10.5 15.2L17 8.5"
                                />

                            </svg>

                        </span>

                    </label>


                    <div class="product-image">

                        <img
                            src="https://ch1156ae-sketch.github.io/new/home_image/%EC%98%A4%EC%9D%B4.jpg"
                            alt="못난이 오이 5입"
                        >

                    </div>


                    <div class="product-detail">

                        <p class="product-name">
                            못난이 오이 5입
                        </p>

                        <p class="product-price">
                            9,000원
                        </p>

                        <div class="quantity">

                            <button
                                type="button"
                                class="minus"
                                aria-label="못난이 오이 수량 감소"
                            >
                                <svg viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M4 8H12"/>
                                </svg>
                            </button>

                            <span class="quantity-value">
                                2
                            </span>

                            <button
                                type="button"
                                class="plus"
                                aria-label="못난이 오이 수량 증가"
                            >
                                <svg viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M4 8H12"/>
                                    <path d="M8 4V12"/>
                                </svg>
                            </button>

                        </div>

                    </div>


                    <button
                        class="remove-button"
                        type="button"
                        aria-label="못난이 오이 삭제"
                    >
                        <svg
                            viewBox="0 0 16 16"
                            fill="none"
                            aria-hidden="true"
                        >
                            <path
                                d="M3.5 3.5L12.5 12.5M12.5 3.5L3.5 12.5"
                                stroke="currentColor"
                                stroke-width="1.4"
                                stroke-linecap="round"
                            />
                        </svg>
                    </button>

                </article>

            </div>


            <div class="empty-cart">
                장바구니에 담긴 상품이 없습니다.
            </div>

        </section>

    </main>


    <!-- PURCHASE -->

    <div class="purchase-area">

        <button
            type="button"
            class="purchase-button"
            id="purchaseButton"
        >

            <svg
                class="purchase-shape"
                viewBox="0 0 327 48"
                preserveAspectRatio="none"
                aria-hidden="true"
            >
                <path
                    d="
                        M7 1
                        C31 2 44 1 68 1
                        C91 1 110 2 134 2
                        C165 2 193 1 223 1
                        C255 1 282 3 315 1
                        C322 0 327 3 327 9
                        L326 38
                        C326 44 322 47 316 47
                        C294 46 278 45 256 46
                        C232 47 209 46 186 47
                        C159 48 133 47 105 48
                        C83 48 61 44 39 45
                        L8 47
                        C2 47 0 43 1 38
                        L4 24
                        L1 11
                        C0 5 2 1 7 1
                        Z
                    "
                    fill="#FF5A20"
                />
            </svg>

            구매하기

        </button>

    </div>


    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    ></div>

</div>
    <script src="./js/cart.js"></script>
</body>
</html>
